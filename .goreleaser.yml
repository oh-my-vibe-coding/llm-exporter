version: 2

project_name: llm-exporter

builds:
  - main: ./cmd/llm-exporter
    binary: llm-exporter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X 'github.com/oh-my-vibe-coding/llm-exporter/internal/version.Version={{ .Version }}'
      - -X 'github.com/oh-my-vibe-coding/llm-exporter/internal/version.GitCommit={{ .ShortCommit }}'
      - -X 'github.com/oh-my-vibe-coding/llm-exporter/internal/version.BuildTime={{ .Date }}'

archives:
  - format: tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

changelog:
  use: github
  sort: asc

release:
  github:
    owner: oh-my-vibe-coding
    name: llm-exporter
