name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 07:23 UTC — off-hour minute to avoid :00/:30 clustering.
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Avoid "Duplicate header: Authorization" when golang/govulncheck-action
          # does its own nested checkout (actions/checkout@v6 persists credentials
          # by default; the nested call then adds a second auth header).
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26'
          check-latest: true
