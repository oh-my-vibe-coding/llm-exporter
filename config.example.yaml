listen_addr: ":9101"

# Webhook alerting: send a POST request when a target fails consecutively.
# webhook:
#   url: "https://hooks.slack.com/services/xxx/yyy/zzz"
#   consecutive_failures: 3   # alert after N consecutive failures (default: 3)

targets:
  # OpenAI GPT-4o
  - name: openai-gpt4o
    endpoint: "https://api.openai.com"
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4o"
    api_format: openai
    timeout: 30s
    interval: 300s
    # Light probe mode: 9 out of 10 probes use minimal tokens to reduce cost.
    # full_probe_every: 10
    # light_prompt: "Hi"
    # light_max_tokens: 5
    #
    # Adaptive interval: increase probe interval when target is stable,
    # reset to base interval on failure. Reduces token usage by ~50%+.
    # adaptive_interval: true
    # max_interval: 1200s        # cap (default: 4x interval)
    # backoff_after: 5           # consecutive successes before backing off (default: 5)
    #
    # Prompt rotation: cycle through multiple prompts to avoid caching.
    # prompts:
    #   - "Hi"
    #   - "Hello"
    #   - "Hey there"
    #
    # Response validation: fail probe if response doesn't match pattern.
    # expect_pattern: "\\d+"
    #
    # Non-streaming mode (default: true). Set to false for simpler APIs.
    # stream: false

  # Anthropic Claude
  - name: anthropic-claude
    endpoint: "https://api.anthropic.com"
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-sonnet-4-20250514"
    api_format: anthropic
    timeout: 30s
    interval: 300s

  # Google Gemini
  - name: google-gemini
    endpoint: "https://generativelanguage.googleapis.com"
    api_key: "${GOOGLE_API_KEY}"
    model: "gemini-2.0-flash"
    api_format: google
    timeout: 30s
    interval: 300s

  # Azure OpenAI
  - name: azure-gpt4o
    endpoint: "${AZURE_OPENAI_ENDPOINT}"
    api_key: "${AZURE_OPENAI_API_KEY}"
    model: "gpt-4o"
    api_format: azure
    # api_version: "2024-10-21"   # 默认值
    timeout: 30s
    interval: 300s

  # OpenRouter (OpenAI 兼容接口)
  - name: openrouter-claude
    endpoint: "https://openrouter.ai/api"
    api_key: "${OPENROUTER_API_KEY}"
    model: "anthropic/claude-sonnet-4"
    api_format: openai
    timeout: 30s
    interval: 300s

  # DeepSeek (OpenAI 兼容接口)
  - name: deepseek-chat
    endpoint: "https://api.deepseek.com"
    api_key: "${DEEPSEEK_API_KEY}"
    model: "deepseek-chat"
    api_format: openai
    timeout: 30s
    interval: 300s

  # Mistral (OpenAI 兼容接口)
  - name: mistral-large
    endpoint: "https://api.mistral.ai"
    api_key: "${MISTRAL_API_KEY}"
    model: "mistral-large-latest"
    api_format: openai
    timeout: 30s
    interval: 300s

  # 阿里百炼 (DashScope - OpenAI 兼容接口)
  - name: dashscope-qwen
    endpoint: "https://dashscope.aliyuncs.com/compatible-mode"
    api_key: "${DASHSCOPE_API_KEY}"
    model: "qwen-plus"
    api_format: openai
    timeout: 30s
    interval: 300s

  # 字节方舟 (Ark - OpenAI 兼容接口)
  - name: ark-pro
    endpoint: "https://ark.cn-beijing.volces.com/api"
    api_key: "${ARK_API_KEY}"
    model: "${ARK_ENDPOINT_ID}"
    api_format: openai
    timeout: 30s
    interval: 300s

  # 自定义代理 API (OpenAI 兼容)
  # 支持 chat_path 自定义路径，extra_headers 自定义请求头
  - name: my-proxy
    endpoint: "https://my-proxy.example.com"
    api_key: "${PROXY_API_KEY}"
    model: "gpt-4o"
    api_format: openai
    chat_path: "/v1/chat/completions"   # 可改为代理的自定义路径
    extra_headers:
      X-Custom-Auth: "${PROXY_TOKEN}"
    timeout: 30s
    interval: 300s

  # Local Ollama (OpenAI-compatible, non-streaming)
  # - name: local-ollama
  #   endpoint: "http://localhost:11434"
  #   model: "llama3"
  #   api_format: openai
  #   stream: false
  #   interval: 30s
