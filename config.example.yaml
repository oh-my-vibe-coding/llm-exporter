listen_addr: ":9101"

# Webhook alerting: send a POST request when a target fails consecutively.
# webhook:
#   url: "https://hooks.slack.com/services/xxx/yyy/zzz"
#   consecutive_failures: 3   # alert after N consecutive failures (default: 3)

# Modules (optional): reusable probe profiles consumed by the blackbox-style
# /probe?target=<endpoint>&module=<name> endpoint. Useful when you want
# Prometheus-driven dynamic target discovery (file_sd, Consul, Kubernetes)
# rather than the static `targets:` block below.
#
# modules:
#   openai-compat-small:
#     api_format: openai
#     model: gpt-5.4-mini
#     api_key: "${OPENAI_API_KEY}"
#     max_tokens: 20
#     timeout: 30s
#   anthropic-small:
#     api_format: anthropic
#     model: claude-haiku-4-5
#     api_key: "${ANTHROPIC_API_KEY}"
#     max_tokens: 20
#     timeout: 30s

targets:
  # ── Flagship providers (scheduled probes) ─────────────────────────────

  # OpenAI GPT-5.5 via Chat Completions
  - name: openai-gpt-5.5
    endpoint: "https://api.openai.com"
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-5.5"
    api_format: openai
    timeout: 60s
    interval: 300s
    # Light probe mode: 9 out of 10 probes use minimal tokens to reduce cost.
    # full_probe_every: 10
    # light_prompt: "Hi"
    # light_max_tokens: 5
    #
    # Adaptive interval: increase probe interval when target is stable,
    # reset to base interval on failure. Reduces token usage by ~50%+.
    # adaptive_interval: true
    # max_interval: 1200s        # cap (default: 4x interval)
    # backoff_after: 5           # consecutive successes before backing off (default: 5)
    #
    # Prompt rotation: cycle through multiple prompts to avoid caching.
    # prompts:
    #   - "Hi"
    #   - "Hello"
    #   - "Hey there"
    #
    # Response validation: fail probe if response doesn't match pattern.
    # expect_pattern: "\\d+"
    #
    # Non-streaming mode (default: true). Set to false for simpler APIs.
    # stream: false

  # OpenAI Responses API (recommended for reasoning models + reasoning_tokens)
  - name: openai-responses-gpt-5.5
    endpoint: "https://api.openai.com"
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-5.5"
    api_format: openai-responses
    timeout: 120s
    interval: 600s

  # Anthropic Claude (current flagship as of 2026-05)
  - name: anthropic-claude-opus-4.7
    endpoint: "https://api.anthropic.com"
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-opus-4-7"
    api_format: anthropic
    timeout: 60s
    interval: 300s

  # Google Gemini
  - name: google-gemini-3.1-pro
    endpoint: "https://generativelanguage.googleapis.com"
    api_key: "${GOOGLE_API_KEY}"
    model: "gemini-3.1-pro"
    api_format: google
    timeout: 60s
    interval: 300s

  # Azure OpenAI
  - name: azure-gpt-5.4
    endpoint: "${AZURE_OPENAI_ENDPOINT}"
    api_key: "${AZURE_OPENAI_API_KEY}"
    model: "gpt-5.4"
    api_format: azure
    # api_version: "2024-10-21"   # default
    timeout: 60s
    interval: 300s

  # ── OpenAI-compatible aggregators & routers ───────────────────────────

  # OpenRouter
  - name: openrouter-claude
    endpoint: "https://openrouter.ai/api"
    api_key: "${OPENROUTER_API_KEY}"
    model: "anthropic/claude-opus-4-7"
    api_format: openai
    timeout: 60s
    interval: 300s

  # DeepSeek
  - name: deepseek-v4-pro
    endpoint: "https://api.deepseek.com"
    api_key: "${DEEPSEEK_API_KEY}"
    model: "deepseek-v4-pro"
    api_format: openai
    timeout: 60s
    interval: 300s

  # Mistral
  - name: mistral-large
    endpoint: "https://api.mistral.ai"
    api_key: "${MISTRAL_API_KEY}"
    model: "mistral-large-latest"
    api_format: openai
    timeout: 30s
    interval: 300s

